    <title>Sweet As Home</title>

    <!--
      Single-Page App redirect decoder for GitHub Pages.
      Restores the original path from the query string produced by 404.html,
      so direct links and refreshes on client-side routes (e.g. /privacy) work.
    -->
    <script>
      (function () {
        var l = window.location
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          )
        }
      })()
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
