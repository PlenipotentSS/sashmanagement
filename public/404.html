<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sweet As Home</title>
    <!--
      Single-Page App redirect for GitHub Pages.
      Direct hits to client-side routes (e.g. /privacy) land here because no static
      file exists. We rewrite the path into a query string and bounce to index.html,
      where a matching snippet restores the original URL before React Router boots.
    -->
    <script>
      (function () {
        var segmentCount = 0
        var l = window.location
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        )
      })()
    </script>
  </head>
  <body></body>
</html>
